<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesse o LiteDesk para acompanhar o atendimento técnico.">
  <title>Entrar · LiteDesk</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-intro" aria-labelledby="brand-title">
      <a class="brand brand-light" href="index.html" aria-label="LiteDesk, página inicial">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span>LiteDesk</span>
      </a>
      <div class="login-intro-copy">
        <h1 id="brand-title">Plataforma de gestão de chamados</h1>
      </div>
    </section>

    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-form-wrap">
        <p class="eyebrow">Acesso à plataforma</p>
        <h2 id="login-title">Boas-vindas</h2>
        <p class="muted">Entre com as credenciais da sua conta.</p>
        <form id="login-form">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" required>

          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>

          <button class="button button-primary login-submit" type="submit">Entrar</button>
          <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
        </form>
        <p class="login-api-note">A autenticação estará disponível quando a API do LiteDesk for conectada.</p>
      </div>
    </section>
  </main>
</body>
</html>
